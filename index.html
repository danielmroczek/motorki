<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css?family=Roboto|Roboto+Mono" rel="stylesheet">
    <!-- Place favicon.ico in the root directory -->

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header class="flex">
        <div class="logo">
            <h1>Brum.io</h1>
        </div>
    </header>

    <section>
        <div class="stage flex">
            <canvas id="gamecanvas"></canvas>
        </div>
    </section>

    <footer class="flex footer">
        <div class="config">
            <div class="select">
                <!-- <label for="">Track:</label> -->
                <select id="trackList" />
            </div>
        </div>

        <div id="results" class="hidden"> <!-- TODO: show results -->
            <p>
                <span>current: </span>
                <span class="current">N/A</span>
            </p>
            <p>
                <span>&nbsp;&nbsp;&nbsp;best: </span>
                <span class="best">N/A</span>
            </p>
            <p>
                <span>&nbsp;&nbsp;&nbsp;last: </span>
                <span class="last">N/A</span>
            </p>
        </div>
    </footer>

    <script src="https://cdn.rawgit.com/progers/pathseg/a1072a7b/pathseg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.2/paper-full.js"></script>
    <script src="js/main.js" type="module"></script>
</body>

</html>
