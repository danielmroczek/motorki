<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css?family=Inconsolata:700|Lato:400,700,900&display=swap" rel="stylesheet">
    <!-- Place favicon.ico in the root directory -->

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header class="flex">
        <div class="logo">
            <h1>Brum.io</h1>
        </div>
    </header>

    <section>
        <div class="stage flex">
            <canvas id="gamecanvas"></canvas>
        </div>
    </section>

    <footer class="flex footer">
        <div class="config">
            <div class="select">
                <!-- <label for="">Track:</label> -->
                <select id="trackList"> </select>
            </div>
        </div>
        <div class="results">
            <div class="red hidden">
                <p>
                    this: <span class="current"></span>
                </p>
                <p>
                    best: <span class="best"></span>
                </p>
                <p>
                    last: <span class="last"></span>
                </p>
            </div>
            <div class="blue hidden">
                <p>
                    this: <span class="current"></span>
                </p>
                <p>
                    best: <span class="best"></span>
                </p>
                <p>
                    last: <span class="last"></span>
                </p>
            </div>
            <div class="white hidden">
                <p>
                    this: <span class="current"></span>
                </p>
                <p>
                    best: <span class="best"></span>
                </p>
                <p>
                    last: <span class="last"></span>
                </p>
            </div>
            <div class="yellow  hidden">
                <p>
                    this: <span class="current"></span>
                </p>
                <p>
                    best: <span class="best"></span>
                </p>
                <p>
                    last: <span class="last"></span>
                </p>
            </div>
        </div>
        
    </footer>

    <script src="https://cdn.rawgit.com/progers/pathseg/a1072a7b/pathseg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.2/paper-full.js"></script>
    <script src="js/main.js" type="module"></script>
</body>

</html>
