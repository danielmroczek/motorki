<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css?family=Inconsolata:700|Lato:400,700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css"
        integrity="sha256-zmfNZmXoNWBMemUOo1XUGFfc0ihGGLYdgtJS3KCr/l0=" crossorigin="anonymous" />
    <!-- Place favicon.ico in the root directory -->

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header>
        <a class="logo" href="#">Brum.io<small>beta</small></a>
    </header>

    <section>
        <div class="stage">
            <canvas id="gamecanvas"></canvas>
        </div>
        <div class="menu-container">
            <div class="menu">

                <div class="trackselect">
                    <!-- <label for="trackList">Track:</label> -->
                    <select id="trackList"> </select>
                    <img class="trackpreview" src="" alt="">
                </div>

                <div class="players">
                    <label>
                        <input type="radio" name="playersCount" value="1" checked>
                        <i class="fas fa-male"></i>
                    </label>

                    <label>
                        <input type="radio" name="playersCount" value="2">
                        <i class="fas fa-male"></i>
                        <i class="fas fa-male"></i>
                    </label>

                    <label>
                        <input type="radio" name="playersCount" value="3">
                        <i class="fas fa-male"></i>
                        <i class="fas fa-male"></i>
                        <i class="fas fa-male"></i>
                    </label>

                    <!-- <label>
                        <input type="radio" name="playersCount" value="3">
                        <i class="fas fa-male"></i>
                        <i class="fas fa-male"></i>
                        <i class="fas fa-male"></i>
                        <i class="fas fa-male"></i>
                    </label> -->

                    </select>
                </div>

                <!-- <div class="playercontrols">
                        <p>Player 1 - <span class="left">◄</span> , <span class="right">►</span></p>
                        <p>Player 2 - <span class="left">A</span> , <span class="right">S</span></p>
                        <p>Player 3 - <span class="left">K</span> , <span class="right">L</span></p>
                </div> -->

                <button class="start"><i class="fas fa-gamepad"></i></button>
            </div>


        </div>
    </section>

    <footer>
        <div class="results">
            <div class="red hidden">
                <p>
                    this: <span class="current"></span>
                </p>
                <p>
                    best: <span class="best"></span>
                </p>
                <p>
                    last: <span class="last"></span>
                </p>
            </div>
            <div class="blue hidden">
                <p>
                    this: <span class="current"></span>
                </p>
                <p>
                    best: <span class="best"></span>
                </p>
                <p>
                    last: <span class="last"></span>
                </p>
            </div>
            <div class="white hidden">
                <p>
                    this: <span class="current"></span>
                </p>
                <p>
                    best: <span class="best"></span>
                </p>
                <p>
                    last: <span class="last"></span>
                </p>
            </div>
            <div class="yellow  hidden">
                <p>
                    this: <span class="current"></span>
                </p>
                <p>
                    best: <span class="best"></span>
                </p>
                <p>
                    last: <span class="last"></span>
                </p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.rawgit.com/progers/pathseg/a1072a7b/pathseg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.2/paper-full.js"></script>
    <script src="js/main.js" type="module"></script>
</body>

</html>
