<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css?family=Inconsolata:700|Lato:400,700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css"
        integrity="sha256-zmfNZmXoNWBMemUOo1XUGFfc0ihGGLYdgtJS3KCr/l0=" crossorigin="anonymous" />

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header>
        <a class="logo" href="#">Kreski</a>
    </header>

    <section>
        <div class="stage">
            <canvas id="gamecanvas"></canvas>
            <div class="countdown hidden">
                <div class="lights">
                    <span class="light"></span>
                    <span class="light"></span>
                    <span class="light"></span>
                </div>
                <p class="go">GO!</p>
            </div>
            <p class="lap-banner hidden"></p>
            <div class="falstart hidden">Falstart +1 s</div>
            <div class="race-result hidden">
                <h2>Bieg ukończony</h2>
                <table>
                    <thead>
                        <tr>
                            <th></th>
                            <th>Kto</th>
                            <th>Czas</th>
                            <th>Najlepsze</th>
                            <th>Kary</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <button class="to-menu">Do menu</button>
            </div>
        </div>
        <div class="menu-container">
            <div class="menu">

                <div class="trackselect">
                    <!-- <label for="trackList">Track:</label> -->
                    <select id="trackList"> </select>
                    <img class="trackpreview" src="" alt="">
                </div>

                <!-- Stawka: 4 sloty, każdy przełącza cyklem
                     pusty → człowiek → komputer (issue: spójne menu) -->
                <div class="roster">
                    <button type="button" class="slot" data-slot="0">
                        <span class="slot-icon"></span>
                    </button>
                    <button type="button" class="slot" data-slot="1">
                        <span class="slot-icon"></span>
                    </button>
                    <button type="button" class="slot" data-slot="2">
                        <span class="slot-icon"></span>
                    </button>
                    <button type="button" class="slot" data-slot="3">
                        <span class="slot-icon"></span>
                    </button>
                </div>
                <p class="roster-hint">Kliknij slot: pusty → człowiek → komputer</p>

                <!-- <div class="playercontrols">
                        <p>Player 1 - <span class="left">◄</span> , <span class="right">►</span></p>
                        <p>Player 2 - <span class="left">A</span> , <span class="right">S</span></p>
                        <p>Player 3 - <span class="left">K</span> , <span class="right">L</span></p>
                </div> -->

                <button class="start"><i class="fas fa-gamepad"></i></button>
            </div>


        </div>
    </section>

    <footer>
        <div class="results">
            <div class="red hidden">
                <p>
                    this: <span class="current"></span>
                </p>
                <p>
                    best: <span class="best"></span>
                </p>
                <p>
                    last: <span class="last"></span>
                </p>
            </div>
            <div class="blue hidden">
                <p>
                    this: <span class="current"></span>
                </p>
                <p>
                    best: <span class="best"></span>
                </p>
                <p>
                    last: <span class="last"></span>
                </p>
            </div>
            <div class="white hidden">
                <p>
                    this: <span class="current"></span>
                </p>
                <p>
                    best: <span class="best"></span>
                </p>
                <p>
                    last: <span class="last"></span>
                </p>
            </div>
            <div class="yellow  hidden">
                <p>
                    this: <span class="current"></span>
                </p>
                <p>
                    best: <span class="best"></span>
                </p>
                <p>
                    last: <span class="last"></span>
                </p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.rawgit.com/progers/pathseg/a1072a7b/pathseg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.2/paper-full.js"></script>
    <script src="js/main.js" type="module"></script>
</body>

</html>
